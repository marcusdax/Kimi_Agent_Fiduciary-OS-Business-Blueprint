version: "3.9"

# Local development stack — Fiduciary OS + trust-core (+ optional frontend)
#
# Default stack (backend + trust-core):
#   docker compose -f docker-compose.dev.yml up
#
# Full stack including React dev server:
#   docker compose -f docker-compose.dev.yml --profile fullstack up
#
# Dev defaults are in .env.dev (committed).
# Put real secrets/API keys in .env (gitignored) — it overrides .env.dev.

services:
  # ── PostgreSQL 16 + pgvector + pgcrypto ────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fiduciary_os
    volumes:
      - dev_pg_data:/var/lib/postgresql/data
      - ./backend/docker/init-pgvector.sql:/docker-entrypoint-initdb.d/01-init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fiduciary_os"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Redis 7 ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Fiduciary OS Express API ───────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3001"
    env_file:
      - .env.dev
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      PORT: "3001"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/fiduciary_os
      DIRECT_URL: postgresql://postgres:postgres@postgres:5432/fiduciary_os
      REDIS_ENABLED: "true"
      REDIS_URL: redis://redis:6379
      TRUST_CORE_URL: http://trust-core:3002
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      trust-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - ./backend/logs:/app/logs
      - backend-db:/app

  # ── trust-core MCP + HTTP sidecar (durable file ledger) ────────────────────
  trust-core:
    build:
      context: ../trust-core
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      PORT: "3002"
      NODE_ENV: development
      LEDGER_MODE: file
      LEDGER_DIR: /app/.data/ledger
    volumes:
      - dev_trust_core_ledger:/app/.data/ledger
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── React frontend dev server ──────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    environment:
      VITE_API_BASE_URL: /api/v1
      BACKEND_PROXY_URL: http://backend:3001
    depends_on:
      backend:
        condition: service_healthy
    profiles:
      - fullstack

volumes:
  backend-db:
  dev_pg_data:
  dev_trust_core_ledger:
