version: "3.9"

# Local development stack — Fiduciary OS + trust-core (+ optional MASTERNEX + frontend)
#
# Default stack (backend + trust-core):
#   docker compose -f docker-compose.dev.yml up
#
# Full stack including React dev server:
#   docker compose -f docker-compose.dev.yml --profile fullstack up
#
# Full stack + MASTERNEX.os (requires marcusdax/masternex.os cloned alongside this repo):
#   docker compose -f docker-compose.dev.yml --profile fullstack --profile masternex up
#
# Dev defaults (SQLite, no API keys needed) are in .env.dev (committed).
# Put real secrets/API keys in .env (gitignored) — it overrides .env.dev.

services:
  # ── Fiduciary OS Express API ───────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3001"
    env_file:
      - .env.dev
      - path: .env
        required: false
    environment:
      NODE_ENV: development
      PORT: "3001"
      TRUST_CORE_URL: http://trust-core:3002
      MASTERNEX_API_URL: http://masternex:8080
      REDIS_ENABLED: "false"
    depends_on:
      trust-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ./backend/src:/app/src
      - ./backend/logs:/app/logs
      - backend-db:/app

  # ── trust-core MCP + HTTP sidecar ─────────────────────────────────────────
  trust-core:
    build:
      context: ../trust-core
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      PORT: "3002"
      NODE_ENV: development
      LEDGER_MODE: memory
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── MASTERNEX.os FastAPI service (optional — requires sibling repo) ────────
  masternex:
    build:
      context: ../../masternex.os
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8080"
      ENVIRONMENT: development
    profiles:
      - masternex
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── React frontend dev server ──────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    environment:
      VITE_API_BASE_URL: /api/v1
      BACKEND_PROXY_URL: http://backend:3001
    depends_on:
      backend:
        condition: service_healthy
    profiles:
      - fullstack

volumes:
  backend-db:
