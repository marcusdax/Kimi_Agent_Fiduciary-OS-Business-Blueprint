version: "3.9"

# Local development stack — Fiduciary OS + trust-core + MASTERNEX
# Usage: docker compose -f docker-compose.dev.yml up
#
# Secrets go in a .env file in this directory (not committed).
# Minimum required vars: DATABASE_URL, JWT_SECRET, TRUST_CORE_JWT_SECRET
# Optional: MASTERNEX_JWT, ANTHROPIC_API_KEY, KIMI_API_KEY

services:
  # ── Fiduciary OS Express API ───────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    env_file: .env
    environment:
      NODE_ENV: development
      PORT: "3001"
      TRUST_CORE_URL: http://trust-core:3002
      MASTERNEX_API_URL: http://masternex:8080
      REDIS_ENABLED: "false"
    depends_on:
      trust-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - ./backend/logs:/app/logs

  # ── trust-core MCP + HTTP sidecar ─────────────────────────────────────────
  trust-core:
    build:
      context: ../../trust-core
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    env_file: .env
    environment:
      PORT: "3002"
      NODE_ENV: development
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── MASTERNEX.os FastAPI service (optional) ────────────────────────────────
  masternex:
    build:
      context: ../../masternex.os
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      PORT: "8080"
      ENVIRONMENT: development
    profiles:
      - masternex
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── React frontend dev server ──────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      args:
        VITE_API_BASE_URL: http://localhost:3001/api/v1
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    environment:
      VITE_API_BASE_URL: http://localhost:3001/api/v1
    depends_on:
      - backend
    profiles:
      - fullstack
