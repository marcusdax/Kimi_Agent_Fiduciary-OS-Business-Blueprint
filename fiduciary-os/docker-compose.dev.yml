# docker-compose.dev.yml — multi-service local development stack.
# Bring up with: docker compose -f docker-compose.dev.yml up
#
# Services:
#   backend      — Fiduciary OS Express API (port 3001)
#   trust-core   — trust-core HTTP + MCP server (port 3002)
#   masternex    — MASTERNEX.os FastAPI service (port 8080)
#
# Required host env vars (copy from .env.example and fill in):
#   MASTERNEX_DATABASE_URL — SQLite or Postgres URL for MASTERNEX
#   TRUST_CORE_SERVICE_TOKEN — ledger:write scoped JWT for backend→trust-core calls

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      DATABASE_URL: file:/data/dev.db
      TRUST_CORE_URL: http://trust-core:3002
      MASTERNEX_API_URL: http://masternex:8080
      TRUST_CORE_SERVICE_TOKEN: ${TRUST_CORE_SERVICE_TOKEN:-}
      MASTERNEX_JWT: ${MASTERNEX_JWT:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
    volumes:
      - backend-data:/data
    depends_on:
      - trust-core
      - masternex
    restart: unless-stopped

  trust-core:
    build:
      context: ../../trust-core
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: development
      PORT: 3002
      LEDGER_MODE: file
      SEC_USER_AGENT: "FiduciaryOS/1.0 dev"
    volumes:
      - trust-core-ledger:/data/ledger
    restart: unless-stopped

  masternex:
    build:
      context: ../../masternex.os
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: ${MASTERNEX_DATABASE_URL:-sqlite:///data/masternex.db}
    volumes:
      - masternex-data:/data
    restart: unless-stopped

volumes:
  backend-data:
  trust-core-ledger:
  masternex-data:
