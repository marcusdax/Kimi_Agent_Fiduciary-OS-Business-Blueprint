# Full-stack demo: API (SQLite, migrated on start) + web. The older docker-compose.yml is stale
# (missing infra/ files, Postgres) and is left untouched.
#   export JWT_SECRET="$(openssl rand -hex 32)" && docker compose -f docker-compose.demo.yml up --build
# API: http://localhost:3001 (reference at /docs)   Web: http://localhost:5173
services:
  migrate:
    build: { context: ./backend, target: build } # build stage keeps the Prisma CLI
    command: ["npx", "prisma", "migrate", "deploy"]
    environment: { DATABASE_URL: "file:/data/app.db" }
    volumes: ["demo-data:/data"]
  api:
    build: { context: ./backend }
    depends_on: { migrate: { condition: service_completed_successfully } }
    ports: ["3001:3001"]
    environment:
      NODE_ENV: production # placeholders fail closed; no fake "live" data
      PORT: "3001"
      DATABASE_URL: "file:/data/app.db"
      JWT_SECRET: ${JWT_SECRET:?generate one, e.g. openssl rand -hex 32}
      CORS_ORIGIN: http://localhost:5173
      REDIS_ENABLED: "false"
    volumes: ["demo-data:/data"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      retries: 10
  web:
    build:
      context: ./frontend
      args: { VITE_API_BASE_URL: http://localhost:3001/api/v1 }
    depends_on: { api: { condition: service_healthy } }
    ports: ["5173:8080"]
    environment: { VITE_API_BASE_URL: http://localhost:3001/api/v1 }
volumes:
  demo-data:
