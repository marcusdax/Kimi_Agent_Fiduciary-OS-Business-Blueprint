name: Deploy Frontend to Vercel

on:
  push:
    branches: [main, claude/tender-hypatia-or577k]
    paths:
      - 'fiduciary-os/frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fiduciary-os/frontend
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fiduciary-os/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://fiduciary-api-sandbox.up.railway.app/api/v1' }}

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice::VERCEL_TOKEN not set — skipping Vercel deployment."
            exit 0
          fi
          ENV=$([[ "${{ github.ref_name }}" == "main" ]] && echo "production" || echo "preview")
          vercel pull --yes --environment="$ENV" --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "url=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.ref_name }}" = "main" ]; then
            URL=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          else
            URL=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Deployment summary
        run: echo "Deployed to ${{ steps.deploy.outputs.url }}"
