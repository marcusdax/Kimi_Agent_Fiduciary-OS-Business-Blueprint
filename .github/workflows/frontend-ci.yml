name: Frontend CI
on:
  push:
    branches: [main]
    paths: ['fiduciary-os/frontend/**', '.github/workflows/frontend-ci.yml']
  pull_request:
    paths: ['fiduciary-os/frontend/**', '.github/workflows/frontend-ci.yml']
permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fiduciary-os/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # verified v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fiduciary-os/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint:styles
      - run: npm run type-check
      - run: npm test
      - run: npm run build
      - run: node --test scripts/serve-static.node-check.mjs
      - run: npm audit
      - run: docker build --build-arg VITE_API_BASE_URL=https://fiduciary-api-sandbox.up.railway.app/api/v1 -t fiduciary-web-release-check .
      - run: npm run export-preview
