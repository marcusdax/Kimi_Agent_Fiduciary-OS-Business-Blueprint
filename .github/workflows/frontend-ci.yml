name: Frontend CI
on:
  push:
    branches: [main]
    paths: ['fiduciary-os/frontend/**', '.github/workflows/frontend-ci.yml']
  pull_request:
    paths: ['fiduciary-os/frontend/**', '.github/workflows/frontend-ci.yml']
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fiduciary-os/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fiduciary-os/frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm test
      - run: npm run build
