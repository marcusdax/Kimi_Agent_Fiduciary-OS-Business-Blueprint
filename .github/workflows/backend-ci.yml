name: CI

# Backend pipeline; the frontend has its own workflow.
# Lives at the repo root because GitHub only runs workflows from /.github/;
# the old fiduciary-os/.github/workflows/ci.yml never executed.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fiduciary-os/backend
    env:
      DATABASE_URL: file:./ci.db
      JWT_SECRET: ci-test-secret
      BCRYPT_ROUNDS: '4'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # verified v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # verified v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fiduciary-os/backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run type-check
      - run: npx prisma migrate deploy
      - run: npx jest --runInBand --coverage
      - run: npm run build
      - run: npm run lint:security
      - run: node ../scripts/backup-restore-drill.mjs
      - run: npm audit --omit=dev
      - run: npm sbom --omit=dev --sbom-format=cyclonedx > /tmp/fiduciary-backend-runtime-sbom.json
      - run: docker build -t fiduciary-api-release-check .
      # New planning endpoints/tests must pass strict lint.
      - name: Planning API lint (blocking)
        run: npm run lint:planning
      - name: Financial API lint (blocking)
        run: npm run lint:financial
      - name: Blueprint tool and provider lint (blocking)
        run: npm run lint:tools
      # Full-repository lint still reports inherited style/type findings.
      # The resolver and source/test project setup are now fixed.
      # See fiduciary-os/backend/LINT_STATUS.md; this step is not a pass gate.
      - name: Full backend lint (known debt, nonblocking)
        run: npm run lint
        continue-on-error: true
